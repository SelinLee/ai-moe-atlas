name: Correction or removal / 纠错或移除 / 訂正・削除
description: Correct attribution, source links, usage terms, or request removal.
title: '[Correction] '
labels: ['correction']
body:
  - type: markdown
    attributes:
      value: |
        Use this form when a creator, source, link, or usage term is wrong, or when an entry should be removed.
        Removal may involve repository history, releases, and deployment caches, not just the visible page.
        Do not include private identity documents or sensitive personal data in a public issue.
  - type: input
    id: entry
    attributes:
      label: Entry URL / 条目链接 / 項目 URL
      description: The atlas page that needs correcting.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Request and evidence / 请求与依据 / 依頼と根拠
    validations:
      required: true
